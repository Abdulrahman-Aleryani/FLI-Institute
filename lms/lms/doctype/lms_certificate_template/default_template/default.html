{% if background_url %}<img class="cert-bg" src="{{ background_url }}" alt="">{% endif %}

<div class="cert-name{% if student_name_is_arabic %} cert-ar{% endif %}">{{ student_name }}</div>
<div class="cert-hours">40-hour</div>
<div class="cert-course{% if course_title_is_arabic %} cert-ar{% endif %}">{{ course_title or batch_title }}</div>
<div class="cert-date cert-date-from">{{ start_date }}</div>
<div class="cert-date cert-date-to">{{ end_date }}</div>

{% if signature_1 %}<div class="cert-signature-wrap">{{ signature_1 }}</div>{% endif %}

<div class="cert-verify">
	{{ qr_code }}
	<div class="cert-serial">{{ serial_number or certificate_id }}</div>
</div>
